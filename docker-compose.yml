services:
  dtv-server:
    build: .
    container_name: dtv-server
    restart: unless-stopped
    ports:
      - "40086:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - OPENSUBTITLES_USER_AGENT=DTV
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./data:/usr/src/app/data
      - /path/to/media:/media:ro
      - /path/to/media/Conversions:/conversions:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
