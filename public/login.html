<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTV - Streaming Media Server</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/DTV_Logo.png" alt="DTV" class="auth-logo-img">
        <p style="color: var(--text-muted);">Self-Hosted Streaming Media Server</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</div>
      </div>

      <div id="alert-box" class="alert"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="name@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
          <span>Log In</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label for="register-email">Email Address</label>
          <input type="email" id="register-email" class="form-control" required placeholder="name@email.com">
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="form-control" required placeholder="Choose a strong password">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
          <span>Register Account</span>
        </button>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
